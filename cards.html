<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>services</title>
        <!-- bootstrap cdn -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="./style.css">
</head>
<body>


<!-- cards start -->


<div class="container cardes">
  <h1 class="text-center">Welcome back!</h1>
  <p class="text-center">Select Your Transaction</p>

  <div class="row g-4 justify-content-center mt-">
    
    <div class="col-11 col-sm-6 col-md-5 col-lg-4 d-flex justify-content-center" onclick="withdraw()">
      <div class="withdraw p-4 rounded-5 text-center w-100">
        <img src="./images/with.webp" width="90" height="80" alt="img">
        <p class="fs-3 fw-semibold mt-3">Withdraw Cash</p>
      </div>
    </div>

    <div class="col-11 col-sm-6 col-md-5 col-lg-4 d-flex justify-content-center" onclick="transfer()">
      <div class="withdraw p-4 rounded-5 text-center w-100">
        <img src="./images/money-transfer.png" width="90" height="80" alt="img">
        <p class="fs-3 fw-semibold mt-3">Transfer Cash</p>
      </div>
    </div>

    </div>



<div class="row g-4 justify-content-center mt-3">
    
    <div class="col-11 col-sm-6 col-md-5 col-lg-4 d-flex justify-content-center" onclick="deposit()">
      <div class="withdraw p-4 rounded-5 text-center w-100">
        <img src="./images/donation.png" width="90" height="80" alt="img">
        <p class="fs-3 fw-semibold mt-3">Deposit Cash</p>
      </div>
    </div>

    <div class="col-11 col-sm-6 col-md-5 col-lg-4 d-flex justify-content-center" onclick="balance()">
      <div class="withdraw p-4 rounded-5 text-center w-100">
        <img src="./images/finance.png" width="90" height="80" alt="img">
        <p class="fs-3 fw-semibold mt-3">Check Balance</p>
      </div>
    </div>

    </div>





</div>

<!-- cards end -->

















    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    
    <script src="./index.js"></script>
</body>
</html>
